<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #282c34;
  font-family: 'Courier New', monospace;
  color: white;
  text-align: center;
}

.container {
  font-size: 2em;
}

.typed-text {
  white-space: nowrap;
  overflow: hidden;
  width: 0;
  animation: typing 4s steps(70) 1s forwards, fadeOut 1s 6s forwards;
}

@keyframes typing {
  from {
    width: 0;
  }
  to {
    width: 100%;
  }
}

@keyframes fadeOut {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

  </style>
  
  <text x="10" y="40" class="text">The right man in the wrong place can make all the difference in the world.</text>
</svg>

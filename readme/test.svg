<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1350 100"
     width="100%" height="100%"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="Frase com aspas">
  <style>
    /* O SVG usa `currentColor` para a cor do texto.
       Defina a variável --app-text-color no CSS do app (quando o SVG for inline)
       ou o SVG usará os fallbacks abaixo (preferências do sistema). */
    svg {
      /* se a variável --app-text-color estiver definida no contexto, ela será usada;
         caso contrário, o fallback abaixo será usado via prefers-color-scheme ou valor direto. */
      color: var(--app-text-color, #ffffff);
    }

    /* Fallbacks: se não houver variável, este media query segue o tema do sistema */
    @media (prefers-color-scheme: light) {
      svg { color: var(--app-text-color, #111111); }
    }
    @media (prefers-color-scheme: dark) {
      svg { color: var(--app-text-color, #ffffff); }
    }

    /* Estilo do texto: usa currentColor para preencher */
    text {
      fill: currentColor;
      font-family: Arial, sans-serif;
      font-size: 24px;
      dominant-baseline: middle;
      /* garante que espaços e glifos possam ser ajustados para caber no textLength */
      length-adjust: spacingAndGlyphs;
    }
  </style>
  <!-- textLength: largura alvo em unidades do viewBox (padding 25 left/right => 1300) -->
  <text x="25" y="50" textLength="1300" lengthAdjust="spacingAndGlyphs" text-anchor="start">
    "The right man in the wrong place can make all the difference in the world"
  </text>
</svg>
